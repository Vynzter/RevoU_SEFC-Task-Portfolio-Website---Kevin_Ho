<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>My Website</title>

    <script src="script.js" defer></script><!--defer agar file JS dipanggil sebelum HTML, untuk hindari plus div not defined-->
    
    <!--External CSS-->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--Logo & Navigation-->
    <header class="main-header">
        <!--Logo-->
        <div class="logo-icon" onclick="toggleMenu()"></div>

         <!-- Navigation -->
        <div class="main-menu">
        <button class="div-button" onclick="location.href='#home-page'">Home</button>
        <button class="div-button" onclick="location.href='#our-profile'">Our Profile</button>
        <button class="div-button" onclick="location.href='#portofolio'">Portfolio</button>
        <button class="div-button" onclick="location.href='#our-headquarter'">Our Headquarter</button>
        <button class="div-button" onclick="location.href='#message-us'">Message Us</button>
        </div>
    </header>
    
    <!--Main Content-->
    <main>
        <!--Home Page-->
        <section>
            <!--Title-->
            <header>
                <h1>Hi <span id="user-greeting">User</span>, Welcome to our website</h1>
            <p>This is my first training website</p>
            </header>

            <div class="banner-image banner-image-1"></div>
            <div class="banner-image banner-image-2"></div>
            <div class="banner-image banner-image-3"></div>

            <br/>

            <button onclick="nextBanner(-1)">Previous</button>
            <button onclick="nextBanner(1)">Next</button>

            <br/>
            
            //////////////////////////

            <div><img class="img-slideshow" src="https://picsum.photos/500/300?random=1"></div>
            <div><img class="img-slideshow" src="https://picsum.photos/500/300?random=2"></div>
            <div><img class="img-slideshow" src="https://picsum.photos/500/300?random=3"></div>

            <br/>
            
            <button onclick ="plusDivs(-1)">Previous</button>
            <button onclick ="plusDivs(1)">Next</button>
        </section>
        <hr/>

        <!--Our Profile-->
        <section>
            <!--Title-->
            <header id="our-profile">
                <h1>Our Profile</h1>
            </header>

            <div class="banner-image"></div>
        </section>
        <hr/>

         <!--Portofolio-->
         <section>
            <!--Title-->
            <header id="portofolio">
                <h1>Portofolio</h1>
            </header

            <div class="content"></div>
        </section>

    <hr/>

        <!--Our Headquarter-->
        <section>
            <!--Title-->
            <header class id="our-headquarter">
                <h1>Our Headquarter</h1>
                
            <!--Logo Headquarter-->
            <nav class="logo-container">
                
                <div class="logo-item">
                    <div class="logo-hq1"></div>
                    <div class="logo-hq-text">Jakarta</div>
                </div>

                <div class="logo-item">
                    <div class="logo-hq1"></div>
                    <div class="logo-hq-text">Bandung</div>
                </div>
                
                <div class="logo-item">
                    <div class="logo-hq1"></div>
                    <div class="logo-hq-text">Medan</div>
                </div>

                <div class="logo-item">
                    <div class="logo-hq1"></div>
                    <div class="logo-hq-text">Denpasar</div>
                </div>
                
            </nav>    
        </header>      
        </section>

    <hr/>

         <!--Message Us-->
         <section>
            <!--Title-->
            <header id="message-us">
                <h1>Message Us</h1>
            </header>
            <div class="form-container">
                <!--Form Biodata-->
                <form action="" id="messageForm">
                    <div class="form-group">
                        <label for="name-input">Name</label>
                        <input type="text" name="name" id="name-input" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="birthdate-input">Birth Date</label>
                        <input type="date" name="birthdate" id="birthdate-input" required>
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <div class="gender-container">
                            <input type="radio" id="male" name="gender" value="Male" required>
                            <label for="male">Male</label>
                            <input type="radio" id="female" name="gender" value="Female" required>
                            <label for="female">Female</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message-input">Message</label>
                        <textarea name="message" id="message-input" rows="4" placeholder="Please enter your message" required></textarea>
                    </div>

                    <button type="submit" id="submit-btn" class="submit-btn">Submit</button>
                </form>
                <div id="result-form" class="message-box"></div>
            </div>
        </section>

    </main>
    <hr/>
    
    <!--Footer-->
    <footer>
        <p>&copy; 2025 - All Right Reserved</p> 
    </footer>

    <footer class="created-by">
        <h5>Created By : KEVIN HO</h5>
    </footer>
    <hr/>

</body>
</html>
